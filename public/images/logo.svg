<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Lingkaran latar -->
  <circle cx="24" cy="24" r="22" fill="#2d6a4f"/>
  <!-- Batang padi tengah -->
  <line x1="24" y1="36" x2="24" y2="14" stroke="#f4a228" stroke-width="2" stroke-linecap="round"/>
  <!-- Bulir padi kiri atas -->
  <ellipse cx="19" cy="17" rx="3.5" ry="2" fill="#f4a228" transform="rotate(-35 19 17)"/>
  <line x1="24" y1="19" x2="19.5" y2="17.5" stroke="#f4a228" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Bulir padi kanan atas -->
  <ellipse cx="29" cy="17" rx="3.5" ry="2" fill="#f4a228" transform="rotate(35 29 17)"/>
  <line x1="24" y1="19" x2="28.5" y2="17.5" stroke="#f4a228" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Bulir padi kiri tengah -->
  <ellipse cx="18" cy="22" rx="3.5" ry="2" fill="#f4a228" transform="rotate(-30 18 22)"/>
  <line x1="24" y1="23" x2="18.5" y2="22.5" stroke="#f4a228" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Bulir padi kanan tengah -->
  <ellipse cx="30" cy="22" rx="3.5" ry="2" fill="#f4a228" transform="rotate(30 30 22)"/>
  <line x1="24" y1="23" x2="29.5" y2="22.5" stroke="#f4a228" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Bulir padi kiri bawah -->
  <ellipse cx="19" cy="27" rx="3.5" ry="2" fill="#74c69d" transform="rotate(-25 19 27)"/>
  <line x1="24" y1="28" x2="19.5" y2="27.5" stroke="#74c69d" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Bulir padi kanan bawah -->
  <ellipse cx="29" cy="27" rx="3.5" ry="2" fill="#74c69d" transform="rotate(25 29 27)"/>
  <line x1="24" y1="28" x2="28.5" y2="27.5" stroke="#74c69d" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Daun kiri bawah -->
  <path d="M24 34 Q18 32 16 36" stroke="#74c69d" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Daun kanan bawah -->
  <path d="M24 34 Q30 32 32 36" stroke="#74c69d" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Border lingkaran -->
  <circle cx="24" cy="24" r="22" stroke="#f4a228" stroke-width="1.5" fill="none"/>
</svg>
